server {
    # 监听 HTTP 并重定向到 HTTPS
    listen 80;
    server_name mik.dong4j.site;
    return 301 https://$host$request_uri;
}

server {
    # 监听 HTTPS
    listen 443 ssl http2;
    server_name mik.dong4j.site;

    # SSL 配置
    ssl_certificate /etc/nginx/encrypt/site/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/site/privkey.pem;

    # 静态页面目录
    root /var/www/mik;
    index landing.html;

    ############################################
    # MIK 特定配置
    ############################################
    
    # 根路径访问时直接返回 landing.html
    location = / {
        try_files /site/landing.html =404;
    }

    # mik.zip 下载
    location = /mik.zip {
        root /var/www/mik;
        types { application/zip zip; }
        add_header Content-Disposition 'attachment; filename="mik.zip"';
    }

    # landing.html
    location = /landing.html {
        alias /var/www/mik/site/landing.html;
    }

    # docs.html
    location = /docs.html {
        alias /var/www/mik/site/docs.html;
    }

    # 文档静态资源目录（docs/）
    location /docs/ {
        alias /var/www/mik/site/docs/;
    }

    # 静态图标（logo.svg / favicon.svg）
    location ~ ^/(logo|favicon)\.svg$ {
        alias /var/www/mik/site/$1.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API 路径走后端代理（转发时去掉 /api 前缀）
    location /api/ {
        proxy_pass http://2.0.0.5:12345/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

